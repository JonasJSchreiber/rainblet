<div class="sparkles"></div>
<div class="shell">
  <header class="header">
    <div>
      <h1>Rainblet</h1>
      <p>Fast quiz rounds. Big shiny rewards.</p>
    </div>
    <div class="header-right">
      <div class="wallet">Coins: {{ coins() }}</div>
      @if (isAuthenticated()) {
        <div class="profile-menu" [class.open]="isProfileMenuOpen()">
          <button class="profile-trigger" type="button" (click)="toggleProfileMenu()" [attr.aria-expanded]="isProfileMenuOpen()">
            @if (authPicture()) {
              <img class="profile-avatar" [src]="authPicture()" alt="User avatar" referrerpolicy="no-referrer" (error)="onProfileImageError()" />
            } @else {
              <span class="profile-avatar fallback">{{ authInitials() }}</span>
            }
            <span class="profile-email">{{ authEmail() }}</span>
          </button>

          @if (isProfileMenuOpen()) {
            <div class="profile-dropdown" role="menu">
              <button class="sign-out-link" type="button" role="menuitem" (click)="logout()">Sign out</button>
            </div>
          }
        </div>
      } @else {
        <button class="auth-btn" type="button" (click)="openLoginModal()">Login</button>
      }
    </div>
  </header>

  <nav>
    <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Home</a>
    <a routerLink="/play" routerLinkActive="active">Play</a>
    <a routerLink="/results" routerLinkActive="active">Results</a>
    <a routerLink="/store" routerLinkActive="active">Store</a>
    <a routerLink="/collection" routerLinkActive="active">Collection</a>
  </nav>

  <main>
    <router-outlet />
  </main>
</div>

@if (isLoginModalOpen() && !isAuthenticated()) {
  <div class="modal-backdrop" (click)="closeLoginModal()">
    <article class="auth-modal" (click)="$event.stopPropagation()">
      <button class="close" type="button" (click)="closeLoginModal()">x</button>
      <h3>Sign in</h3>

      <form class="email-login" (ngSubmit)="submitEmailLogin()">
        <label for="login-email">Email address</label>
        <input id="login-email" type="email" [ngModel]="loginEmail()" (ngModelChange)="loginEmail.set($event)" name="loginEmail" required />

        <label for="login-password">Password</label>
        <input
          id="login-password"
          type="password"
          [ngModel]="loginPassword()"
          (ngModelChange)="loginPassword.set($event)"
          name="loginPassword"
          required />

        @if (loginError()) {
          <p class="error">{{ loginError() }}</p>
        }

        <button class="submit" type="submit" [disabled]="isLoginSubmitting()">
          @if (isLoginSubmitting()) { Signing in... } @else { Login with Email }
        </button>
      </form>

      <button class="google" type="button" (click)="loginWithGoogle()">Login with Google (new tab)</button>
      <button class="create" type="button" (click)="goToCreateUser()">Create user</button>
    </article>
  </div>
}
