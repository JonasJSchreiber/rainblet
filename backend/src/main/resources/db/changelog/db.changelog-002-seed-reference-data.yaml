databaseChangeLog:
  - changeSet:
      id: 002-001-create-stickers-table
      author: codex
      preConditions:
        onFail: MARK_RAN
        not:
          tableExists:
            tableName: stickers
      changes:
        - createTable:
            tableName: stickers
            columns:
              - column:
                  name: id
                  type: varchar(120)
                  constraints:
                    nullable: false
                    primaryKey: true
                    primaryKeyName: pk_stickers
              - column:
                  name: name
                  type: varchar(120)
                  constraints:
                    nullable: false
              - column:
                  name: rarity
                  type: varchar(16)
                  constraints:
                    nullable: false
              - column:
                  name: emoji
                  type: varchar(32)
                  constraints:
                    nullable: false

  - changeSet:
      id: 002-002-seed-collectibles
      author: codex
      preConditions:
        onFail: MARK_RAN
        and:
          - tableExists:
              tableName: collectibles
          - sqlCheck:
              expectedResult: "0"
              sql: SELECT COUNT(*) FROM collectibles
      changes:
        - insert:
            tableName: collectibles
            columns:
              - column: { name: id, value: "spark-seed" }
              - column: { name: name, value: "Spark Seed" }
              - column: { name: description, value: "Awarded the first time you answer correctly." }
              - column: { name: rarity, value: "common" }
              - column: { name: unlock_rule, value: "Get 1 correct answer." }
        - insert:
            tableName: collectibles
            columns:
              - column: { name: id, value: "streak-3" }
              - column: { name: name, value: "Streak Stone" }
              - column: { name: description, value: "You held focus with a 3-answer streak." }
              - column: { name: rarity, value: "common" }
              - column: { name: unlock_rule, value: "Reach a 3-answer streak." }
        - insert:
            tableName: collectibles
            columns:
              - column: { name: id, value: "score-60" }
              - column: { name: name, value: "Scholar Crest" }
              - column: { name: description, value: "A badge for high-scoring knowledge runs." }
              - column: { name: rarity, value: "rare" }
              - column: { name: unlock_rule, value: "Score at least 60 points in one round." }
        - insert:
            tableName: collectibles
            columns:
              - column: { name: id, value: "perfect-run" }
              - column: { name: name, value: "Perfect Prism" }
              - column: { name: description, value: "Granted only to players with a flawless round." }
              - column: { name: rarity, value: "epic" }
              - column: { name: unlock_rule, value: "Answer every question correctly." }
        - insert:
            tableName: collectibles
            columns:
              - column: { name: id, value: "veteran-5" }
              - column: { name: name, value: "Rain Veteran Medal" }
              - column: { name: description, value: "Shows long-term persistence and repeated play." }
              - column: { name: rarity, value: "rare" }
              - column: { name: unlock_rule, value: "Finish 5 sessions in this browser tab session." }

