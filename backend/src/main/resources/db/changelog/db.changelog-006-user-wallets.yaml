databaseChangeLog:
  - changeSet:
      id: 006-create-user-wallets
      author: codex
      preConditions:
        onFail: MARK_RAN
        not:
          tableExists:
            tableName: user_wallets
      changes:
        - createTable:
            tableName: user_wallets
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    nullable: false
                    primaryKey: true
                    primaryKeyName: pk_user_wallets
              - column:
                  name: user_id
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: coins
                  type: int
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: points
                  type: int
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: datetime(6)
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: datetime(6)
                  constraints:
                    nullable: false

  - changeSet:
      id: 006-add-user-wallets-user-uk
      author: codex
      preConditions:
        onFail: MARK_RAN
        and:
          - tableExists:
              tableName: user_wallets
          - not:
              uniqueConstraintExists:
                tableName: user_wallets
                constraintName: uk_user_wallets_user
      changes:
        - addUniqueConstraint:
            tableName: user_wallets
            columnNames: user_id
            constraintName: uk_user_wallets_user

  - changeSet:
      id: 006-add-user-wallets-user-fk
      author: codex
      preConditions:
        onFail: MARK_RAN
        and:
          - tableExists:
              tableName: user_wallets
          - tableExists:
              tableName: users
          - not:
              foreignKeyConstraintExists:
                foreignKeyName: fk_user_wallets_user
      changes:
        - addForeignKeyConstraint:
            baseTableName: user_wallets
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_user_wallets_user
            onDelete: CASCADE