databaseChangeLog:
  - changeSet:
      id: 001-add-users-password-hash
      author: codex
      preConditions:
        onFail: MARK_RAN
        and:
          - tableExists:
              tableName: users
          - not:
              columnExists:
                tableName: users
                columnName: password_hash
      changes:
        - addColumn:
            tableName: users
            columns:
              - column:
                  name: password_hash
                  type: varchar(255)
