databaseChangeLog:
  - changeSet:
      id: 013-001-remove-history-timeline-which-options
      author: codex
      preConditions:
        onFail: MARK_RAN
        and:
          - tableExists:
              tableName: question_options
          - tableExists:
              tableName: questions
      changes:
        - delete:
            tableName: question_options
            where: question_id IN (
              SELECT id FROM questions WHERE id LIKE 'history-history-timeline-%-which-%'
            )

  - changeSet:
      id: 013-002-remove-history-timeline-which-questions
      author: codex
      preConditions:
        onFail: MARK_RAN
        tableExists:
          tableName: questions
      changes:
        - delete:
            tableName: questions
            where: id LIKE 'history-history-timeline-%-which-%'

