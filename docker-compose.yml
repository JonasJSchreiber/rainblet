services:
  mysql:
    image: mysql:8.4
    container_name: rainblet-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: rainblet
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: rainblet-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/rainblet?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      APP_CORS_ALLOWED_ORIGINS: http://localhost:4200
      APP_AUTH_OAUTH2_SUCCESS_REDIRECT: http://localhost:4200
      APP_AUTH_JWT_SECRET: ${APP_AUTH_JWT_SECRET:-replace-with-a-very-long-dev-secret-32-plus-chars}
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
    container_name: rainblet-frontend
    depends_on:
      - backend
    ports:
      - "4200:4200"

volumes:
  mysql_data:
